<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书库</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        background: linear-gradient(180deg, #eef7ff 0%, #d6ebff 100%);
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #1e4a6b;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 20px;
    }

    h1 {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 2px;
        margin-bottom: 8px;
        color: #17405f;
    }

    .sub {
        color: #7fa3bd;
        font-size: 0.9rem;
        margin-bottom: 44px;
    }

    .shelf {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        max-width: 720px;
    }

    .book {
        min-width: 160px;
        padding: 26px 20px;
        background: #ffffff;
        border-radius: 10px;
        border-left: 5px solid #4da3e6;
        box-shadow: 0 4px 14px rgba(90, 150, 210, 0.14);
        text-align: center;
        text-decoration: none;
        color: #1e4a6b;
        font-size: 1.1rem;
        font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .book:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 22px rgba(90, 150, 210, 0.26);
        color: #0f6db3;
    }
</style>
</head>
<body>
    <h1>书库</h1>
    <div class="sub">点击书名开始阅读</div>
    <div class="shelf">
        <a class="book" href="./sydns.html">深渊的凝视</a>
        <a class="book" href="./lihua.html">九洲：梨花微雨</a>
    </div>
</body>
</html>
