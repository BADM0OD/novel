<style>
    :root {
        --paper: #f7f3e9;

        --ink-2: #5d584e;
        --qing: #4f7a6f;
        --line: rgba(79, 122, 111, 0.26);

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        color: var(--ink);
        font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
        background:
            radial-gradient(1100px 560px at 12% -8%, #fffdf7 0%, rgba(255,253,247,0) 60%),
            radial-gradient(900px 480px at 92% 0%, #f1ebdc 0%, rgba(241,235,220,0) 55%),
            linear-gradient(180deg, #f8f4ea 0%, #f2ebdb 100%);
        background-attachment: fixed;
        line-height: 1.9;
    }
    body::before {
        content: "";
        position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .35;
        background-image:
            repeating-linear-gradient(0deg, rgba(140,120,90,.035) 0 1px, transparent 1px 3px),
            repeating-linear-gradient(90deg, rgba(140,120,90,.025) 0 1px, transparent 1px 4px);
    }
    .wrap { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 0 22px 60px; }

    /* ---------- 目录页 ---------- */
    .hero { position: relative; text-align: center; padding: 86px 0 30px; }
    .hero h1 { font-size: 2.35rem; font-weight: 600; letter-spacing: .1em; line-height: 1.5; color: #232220; }
    .rule { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 32px auto 0; max-width: 320px; }
    .rule::before, .rule::after { content: ""; height: 1px; flex: 1; }
    .rule::before { background: linear-gradient(90deg, transparent, var(--line)); }
    .rule::after { background: linear-gradient(90deg, var(--line), transparent); }
    .rule i { width: 6px; height: 6px; background: var(--qing); transform: rotate(45deg); opacity: .75; }

    .petals { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .petal {
        position: absolute; top: -16px; border-radius: 60% 40% 60% 40%;
        background: rgba(255,255,255,.9);
        box-shadow: 0 0 6px rgba(170,195,185,.4);
        animation: fall linear infinite;
    }
    @keyframes fall {
        0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
        12% { opacity: .85; }
        100% { transform: translateY(430px) translateX(46px) rotate(300deg); opacity: 0; }
    }

    .toc { margin-top: 46px; }
    .toc-head {
        display: flex; justify-content: space-between; align-items: baseline;
        font-size: .82rem; letter-spacing: .22em; color: var(--ink-2); padding-bottom: 10px;
    }
    .toc-item {
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        padding: 22px 14px; border-bottom: 1px solid rgba(79,122,111,.15);
        text-decoration: none; color: var(--ink);
        transition: background .25s ease, padding-left .25s ease;
    }
    .toc-item:first-child { border-top: 1px solid rgba(79,122,111,.15); }
    .toc-item:hover { background: rgba(79,122,111,.06); padding-left: 22px; }
    .toc-item .num { font-size: 1.15rem; letter-spacing: .24em; }
    .toc-item .arrow { color: var(--qing); opacity: .55; font-size: .95rem; }

    .shelf-back { display: flex; justify-content: center; margin-top: 48px; }

    .btn {
        display: inline-block; padding: 10px 26px;
        border: 1px solid var(--line); border-radius: 2px;
        color: var(--qing); text-decoration: none;
        font-size: .9rem; letter-spacing: .16em;
        background: rgba(255,255,255,.5);
        transition: all .25s ease;
    }
    .btn:hover { background: var(--qing); border-color: var(--qing); color: #fff; }
    .btn[aria-disabled="true"] { opacity: .28; pointer-events: none; }

    footer { text-align: center; color: #8b8578; font-size: .8rem; letter-spacing: .14em; padding: 42px 0 18px; }

    /* ---------- 阅读页 ---------- */
    .reader { display: none; }
    .reader.active { display: block; }
    .reader-top {
        display: flex; justify-content: space-between; align-items: center;
        padding: 26px 0 16px; border-bottom: 1px solid rgba(79,122,111,.15);
    }
    .reader-top .bookname { font-size: .88rem; letter-spacing: .16em; color: var(--ink-2); text-decoration: none; }
    .reader-top .bookname:hover { color: var(--qing); }
    .reader-top .back { font-size: .86rem; color: var(--qing); text-decoration: none; letter-spacing: .12em; }

    .chapter-head { text-align: center; padding: 54px 0 30px; }
    .chapter-head .num { font-size: 2.2rem; letter-spacing: .22em; text-indent: .22em; }
    .chapter-head .num small { font-size: .95rem; color: var(--ink-2); letter-spacing: .2em; }

    .paper {
        background: rgba(255,255,255,.55);
        border: 1px solid rgba(79,122,111,.12);
        padding: 44px 46px;
        box-shadow: 0 12px 34px rgba(120,100,60,.07);
    }
    .paper p { font-size: 1.06rem; line-height: 2.15; text-indent: 2em; margin-bottom: 1.02em; }
    .paper p:last-child { margin-bottom: 0; }

    .chapter-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; margin-top: 38px; }
    .chapter-nav .prev { justify-self: start; }
    .chapter-nav .next { justify-self: end; }

    @media (max-width: 640px) {
        .hero { padding: 58px 0 26px; }
        .hero h1 { font-size: 1.75rem; }
        .paper { padding: 28px 22px; }
        .paper p { font-size: 1rem; line-height: 2.05; }
        .reader-top { font-size: .85rem; }
    }
</style>

<script>
const CHAPTERS = [{"id":"1","label":"一","paras":["天佑四年，三月十七。","今年雍州的初春很冷，大地上的寒气毫无消退的迹象，可是在最西边的边塞城池，第一朵梨花却开了。","清晨的铁岭城巍然耸立在连绵的山脉上，高大坚硬的石墙上蒙着一层薄薄的黄尘。晨风干燥，虽已是东曦初升之时，城墙上却连一丝水汽也无。","沉重的城门吱呀一声响了，一白一黑两匹骏马一前一后奔出。前头是一匹银白色的大宛马，头细颈高，四肢修长，皮薄毛细，银白色的金属光泽随着奔跑在涌动的皮肤上流淌。这是大唐最顶尖的战马，大唐轻骑曾骑乘此马击退西突厥，拓展了雍州的疆域。","马背上负着一个少女，身子微微前倾，手中稳稳抓着缰绳，一袭青衣在边塞的劲风中肆意飘扬。大宛马脚力快如闪电，此刻却并不全力奔袭。身后的黑马紧紧跟着，漆黑鬃毛油光水滑，虽不是大宛马这样的名驹，却也是军营中不可多得的好马。马背上亦是一个少女，一袭黄衣，身材比前头那人略矮小些，骑术却同样熟练自如。","一白一黑两道轨迹向城后的山脉延伸，登上城外一道邻近的山尖，银白色的身影勒马停下，身后的黑马随之停住，跟着前骑一同向下望去。","眼前豁然开朗，山峰之下，四面山脉合围，形成一个低浅的洼地。山尖上大漠风沙呼啸，洼地里却宛如世外仙境。","那是一片无边的梨花林，千万株梨树铺满了整片洼地，树冠连绵起伏，像一场落在山谷里的雪。枝头的花簇开得正盛，白得近乎透明，日光从花瓣间筛过，落在树下便成一层薄薄的银纱。风从山尖灌下去，穿过谷地，整片梨花林便缓缓涌动，花浪一波接一波地翻，细碎的花瓣被风卷起，在半空旋了旋，又纷纷扬扬地落回林间。","青衣少女轻轻一夹马腹，大宛马便顺着山坡缓步向下，蹄下碎石簌簌滚落。越往下走，风越柔，花越香，梨花林在眼前一寸寸放大，清香随着柔柔摇动的花簇扑了满脸。","进了林子，头顶便不见天日，只有层层叠叠的白花和枝叶间漏下的碎光。马蹄踩在落花上，发出细微的沙沙声，黄衣黑马跟在后头。一条窄溪在林中蜿蜒而过，水声叮咚，澄澈清脆。溪边生着一片矮矮的青草，嫩得能掐出水来。","前头的少女翻身下马，撒开缰绳，银白的大宛并不奔走，只是低下头随意地踱着步。黄衣少女也下了马，快走两步跟上来。","“今年的梨花开得好，小姐不如采一些回去，做梨花酿是极好的。”","青衣少女在前头漫无目的地走着，牵过身边的一簇花枝，凑在鼻尖深深细闻。听见黄衣侍女的话，回头道。","“酒窖里的陈年的梨花酿怕是都喝不完，今年的新酒过不了多久酒坊也会叫人来采，费那个力作甚。”","“自己酿的自然跟酒坊的不一样了，小姐现在不酿，若是哪天遇到一个如意郎君可就无酒可送了。”侍女玩笑着说。","梨花酿是铁岭城的特色，得益于这片梨花林奇迹般地出现在雍州荒凉的大漠，清冽的梨花酿为边塞枯燥贫乏的生活添了许多色彩。铁岭的许多传统都与梨花有关，譬如年轻男女若有心上人，便会送上自己亲手酿的梨花酿作为礼物。城中结婚时，还有新郎要喝下滴入新娘指尖血的梨花酿的风俗。","“去去去，尽耍贫嘴，哪有男人值得我给他送酒。再说了，我可是将军府唯一的女儿，要送也是他们给我送。”少女白了一眼侍女，回嘴道。","“好啊，那乱世爆发之时，我和小姐一起漂泊天涯，若是手上有一壶自己酿的梨花酿，在异乡也可缓解乡愁吧。”","“别乱说话，如今天下太平哪来的乱世，再说，若是思乡的话，带着酒坊的精酿不就好了。”","“切，如今这天下谁不知乱世将至。自从去年荧惑逆行，连消失百年的女娲星和盘古星都重现星空，加之藩王动作不断，历史上哪一次改朝换代不是如此。幸好小姐是习武之人，以后就要靠小姐庇佑我咯。”","“天下大事岂是儿戏，我那点功夫莫说庇佑你，能自保都不错了，要是乱世真来了我第一个把你卖了。”","侍女闻言做了个鬼脸，“就知道小姐不靠谱，还好将军位高权重，就算乱世来了咱们至少还能安稳度日。”","青衣少女正欲回答，忽然顿住了，她的眼睛死死盯向花林来时的方向。侍女跟着望去，除了无尽的云朵般的花丛什么也没有。青衣少女的脸色却更差了，她闭上眼睛，侧过脑袋，转而用耳朵去寻觅。","少女猛地睁开眼，一把抓住侍女的手，拽着她就往回跑。侍女一个踉跄，险些跌倒，少女却不减速，拖着侍女狂奔起来。","“小……小姐，怎么了？”侍女勉强开口，疑惑地问。","“狼。”","“狼？怎么可能，梨花林可是在城后的腹地，狼怎么会到这里来。而且以小姐的武艺，一只狼何必……”","侍女的话突然顿住了，她也听见了，那是一种沉闷的轰鸣，是从最嗜血最残暴的野兽的喉咙中发出来的，夹杂在花枝摇曳的窸窣声中，此起彼伏，越来越清晰。那可不是一只，而是一群！","大漠上是有狼的，而且是最危险的群狼，它们追逐水与猎物漂泊。铁岭城是大唐九州最西方的边塞，再往西就是西域的无垠沙漠。初春时节，西北的水源河流通常已经解冻，狼群不会东迁，更别提此处是城后的腹地，狼群要绕过庞大的铁岭城才能到达此处。","可是她分明听到了狼群的低鸣。","“马，我们要上马。”小姐拽着她往回奔，急切地四处张望着。没有马，她们不可能跑出狼群。两匹马都是训练有素的战马，哪怕遭遇狼群也不会自己跑走，更何况她们也没听见马遇到狼群的嘶鸣，只是她们走的太深，还未回到下马的地方。","一种令人反胃的腥臊味透过浓郁的梨花香气，刺入两人的鼻腔。小姐的脸色也变得惨白，终于停下了脚步。她们还是不够快，狼群已经到了附近，发现她们和马匹只是时间问题。","梨花还在落，一片一片，落在她僵直的肩头，那腥臊味却越来越浓，终于破开繁密的花丛，一只灰狼从洁白的花幕中探出身子，盯住了她们。","它微低前肢，摆出警戒的姿态，黄浊的眼里散着瘆人的凉意。小姐将侍女拉到身后，从腰间的牛皮扣带里拔出一把手掌长的匕首，朝向灰狼。","灰狼浑浊的瞳色里闪过几丝变化，并未扑上来，它后退几步，昂起脑袋嚎叫起来。","“嗷呜——”","高昂的嚎叫在静谧的林中清晰刺耳，如同水波般散开。几息间，又是好几只灰狼从花丛中钻出，她们被包围了。","狼群合围成一个半圆，靠前的几只前肢下压，身子不断左右摆动，这是野狼扑袭的前兆动作。青衣少女不再言语，她的重心下沉，脑中宁静下来，感受到浑身气血的流淌。她攥紧匕首，气血涌入双腿，她要搏命突围。黄衣侍女虽然脸色煞白，此时也心领神会地压低身子，等着小姐一声令下。","“三。”","“二。”","“一。”","“冲！”","少女一声暴喝，率先如一根青色羽箭般激射而出，瞬间便冲到第一只狼身前。右手一挥，匕首划出一轮锋利的钩月，前狼的脖颈瞬间破裂，血腥骚臭的血液喷溅而出。侍女紧随其后，跟着小姐开出的通路一路前奔。","狼群马上反应过来，一瞬之间嚎叫声四起，狼群从四面八方合围过来，两人哪里跑得过能在荒漠上迅捷如风的狼群，转瞬之间再次被堵住。狼群不再等待，几头身强力健的公狼一拥而上，将两人扑倒在地。","青衣沾满血腥与泥泞，已然变成血衣。小姐将匕首举在脸前，刀锋朝外，一头扑上来的野狼自己撞上刀口，倒了下去。可紧接着又是数只灰狼从侧面冲将上来，巨力撞得少女手腕酸麻，匕首也被撞飞出去。","眼前的饿狼已经张开大口，少女能清晰地看见它布满黄渍的獠牙与恶臭的狼口，她的大脑里此刻什么都没有了，只是呆滞地等待着。","“吼！！！！！”","震耳欲聋的咆哮声如惊雷般在耳边炸响，獠牙还未落下，忽然远去，连同着那整头灰狼都飞了出去。少女循声望去，如见神临。","后来覃思齐每次回忆起这个画面都不禁哆嗦，那雄壮的黑影如同武神下凡，携带着无可匹敌的巨力与莫名的安心感。","那是一只一丈多高的黑熊。庞大的身躯如一座高大的铁山横在少女面前，全身覆满漆黑油亮的粗毛，根根分明，如同铁丝。它高扬起柱子般的前肢，浑厚的熊掌破风呼啸，所到之处，野狼一只只像破麻袋一般飞出去。","“吼！”黑熊的胸腔里滚起雷鸣般的咆叫，剩下的几头灰狼无不战栗，纷纷夹起尾巴，逃也似的没入花林。","“小姐！你还好吗？”","侍女快速从地上爬起来，凑到了少女身边，紧紧地捏着她的衣角。她的眼睛忍不住瞥了几眼这只忽然出现的巨大黑熊，却又不敢多看，低眸看向少女。","少女的一袭青衣已经彻底被血污浸透，她挣扎着起身，拍拍侍女的攥紧的手，“没事，你也是，没受伤吧。”侍女摇摇头。","少女望向那只小山般的黑熊，赶走狼群后，它并未离开，而是静静地立在原地看着她们。","“谢谢你，唔……你身上有妖气，应该听得懂吧？”","黑熊点点头，俯下脑袋，口吐人言：","“狼群还在附近，我会在此威慑住它们，我听见城里的轻骑已经赶过来了，他们到之前我会走，还望为我保密，不要说出我的存在。”","“好，感谢阁下出手相救。小女子覃思齐，家父是雍西节度使，若是有什么需要的我都能尽力满足。”","黑熊点点头，“举手之劳，无足挂齿。在下熊荣泽，豫州熊妖，为躲避镇妖司四处漂泊，途径此处。”","“节度使也是朝廷命官，与镇妖司算是同僚，阁下不怕我揭露行踪么？”","“我知道姑娘担心什么，人妖殊途，我又是被镇妖司逼至此处，出手相助恐怕是别有所图。请姑娘放心，我出手只是不愿目睹他人死去，并无他意，很快便会离开此处。”","“是我狭隘了，多谢阁下，我定会保守秘密。”","“如此最好，骑兵将至，熊某先告辞了。”熊荣泽身上乌光一闪，浑身肌肉毛发飞速收缩起来，一丈多高的身躯瞬间变小，化为一个六尺多高的少年。但见他一袭黑袍，面孔白净，肩宽背阔，对覃思齐微微颔首。","“告辞。”","语毕，一缕黑雾炸开，少年消失不见。","“小姐，他……”侍女正欲说什么，远处密集的马蹄声渐渐响起，不断靠近。","“啊！定是城中的轻骑到了。”","“思齐！”","一道粗犷的呼唤从花林前方传来，马蹄声转瞬即近。","“爹爹，我在这！”覃思齐也大声回应，拉起侍女的手向声音传来的方向跑去。雪白的花幕里，一人一马破花而出，淡金色的大宛马在覃思齐面前收住脚步，马背上是一个孔武有力的中年男人，虎背熊腰。他伸出一只粗壮的手臂，抚在覃思齐脑袋上。","“齐儿，没受伤吧。今年天冷，西边的冰河还没解冻，这群畜生竟然走了二十里路绕过铁岭城。幸好巡逻的队伍看见了它们走过的脚印，我立刻带了五十轻骑赶来。你的衣服怎么……”","“遇到了两只落单的独狼，侥幸胜了。”","“好，不愧是我的女儿。我已派了人去清剿狼群，我们回城吧。”","几个轻骑将士从花丛里钻出，牵来了银白色的大宛和黑马，覃思齐和侍女翻身上马，轻磕马腹，一行人向着铁岭城回去。"]}];

const tocView = document.getElementById('toc-view');
const readerView = document.getElementById('reader-view');
const tocList = document.getElementById('toc-list');
const slot = document.getElementById('chapter-slot');

function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

CHAPTERS.forEach(function (ch) {
    const a = document.createElement('a');
    a.className = 'toc-item';
    a.href = '#chapter-' + ch.id;
    a.innerHTML = '<span class="num">第' + esc(ch.label) + '章</span>' +
                  '<span class="arrow">→</span>';
    tocList.appendChild(a);
});
document.getElementById('toc-count').textContent = '共 ' + CHAPTERS.length + ' 章';

function showToc() {
    tocView.style.display = 'block';
    readerView.classList.remove('active');
    window.scrollTo(0, 0);
}

function showChapter(i) {
    const ch = CHAPTERS[i];
    const prev = CHAPTERS[i - 1];
    const next = CHAPTERS[i + 1];

    const p = prev
        ? '<a class="btn prev" href="#chapter-' + prev.id + '">← 上一章</a>'
        : '<span class="btn prev" aria-disabled="true">← 上一章</span>';
    const n = next
        ? '<a class="btn next" href="#chapter-' + next.id + '">下一章 →</a>'
        : '<span class="btn next" aria-disabled="true">下一章 →</span>';

    const body = ch.paras.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('');

    slot.innerHTML =
        '<div class="chapter-head"><div class="num"><small>第</small>' + esc(ch.label) + '<small>章</small></div></div>' +
        '<article class="paper">' + body + '</article>' +
        '<nav class="chapter-nav">' + p +
        '<a class="btn" href="#toc">返回目录</a>' + n + '</nav>';

    tocView.style.display = 'none';
    readerView.classList.add('active');
    window.scrollTo(0, 0);
}

function route() {
    const h = location.hash;
    if (h.indexOf('#chapter-') === 0) {
        const id = h.slice(9);
        const i = CHAPTERS.findIndex(function (c) { return c.id === id; });
        if (i >= 0) { showChapter(i); return; }
    }
    showToc();
}

window.addEventListener('hashchange', route);
route();

// 梨花花瓣
(function () {
    const box = document.getElementById('petals');
    for (let i = 0; i < 9; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        const w = 7 + Math.random() * 6;
        p.style.width = w + 'px';
        p.style.height = (w * 1.35) + 'px';
        p.style.left = (Math.random() * 100) + '%';
        p.style.animationDuration = (9 + Math.random() * 8) + 's';
        p.style.animationDelay = (-Math.random() * 14) + 's';
        p.style.opacity = 0.45 + Math.random() * 0.45;
        box.appendChild(p);
    }
})();
</script>
</body>
</html>
